# Cloud-hosted open-weight models via NVIDIA's OpenAI-compatible NIM API.
# Requires NVIDIA_API_KEY to be set. Use with:
#   python scripts/run_pilot.py --config configs/benchmark.yaml --models configs/models.nvidia.yaml

generation:
  temperature: 0
  top_p: 1.0
  max_tokens: 4096
  retries: 2
  seed: 42
  timeout_seconds: 120

cache:
  enabled: true
  path: "results/cached_outputs"

models:
  - id: "openai/gpt-oss-120b"
    provider: "local"
    role: "large_open_weight"
    endpoint: "https://integrate.api.nvidia.com/v1"
    env_key: "NVIDIA_API_KEY"

  - id: "deepseek-ai/deepseek-v4-flash-0731"
    provider: "local"
    role: "large_open_weight"
    endpoint: "https://integrate.api.nvidia.com/v1"
    env_key: "NVIDIA_API_KEY"
    # extra_body left unset deliberately: this model can run with an
    # optional "thinking"/reasoning_effort mode (see NVIDIA's own example),
    # but every other model in this roster runs under plain default
    # settings, so this one does too for comparability. Uncomment to
    # enable extended thinking instead:
    # extra_body:
    #   chat_template_kwargs:
    #     thinking: true
    #     reasoning_effort: "high"
