# Definitions for the five context-minimization levels (C0-C4).
# Each level is applied by src/homeleakbench/benchmark/minimization.py
levels:
  C0:
    name: full_context
    description: "Resident identifiers, exact rooms, timestamps, and activities are retained."
    remove_identity: false
    coarsen_time: false
    coarsen_location: false
    aggregate_only: false

  C1:
    name: identity_removed
    description: "Resident identifiers are removed and replaced with anonymous references."
    remove_identity: true
    coarsen_time: false
    coarsen_location: false
    aggregate_only: false

  C2:
    name: time_coarsened
    description: "Exact timestamps are replaced with broad time-of-day periods."
    remove_identity: true
    coarsen_time: true
    coarsen_location: false
    aggregate_only: false

  C3:
    name: location_coarsened
    description: >
      Exact rooms are replaced with a functional room category (sleep,
      hygiene, work, food, dining, communal, passage). Categories are
      deliberately NOT the private_location task's own label vocabulary
      (private_area / shared_area); recovering that label from a
      functional category requires the same background-knowledge
      inference a model must already apply at C0-C2 from a bare room
      name (e.g. "bedroom implies private"), not a string match against
      the narrative text. See docs/threat_model.md and the construct-
      validity note in docs/annotation_guidelines.md.
    remove_identity: true
    coarsen_time: true
    coarsen_location: true
    aggregate_only: false

  C4:
    name: aggregate_state
    description: >
      Only structural summary statistics remain (event count, distinct
      rooms touched, distinct sensor types, window duration). The
      aggregate deliberately does NOT report resident count or a
      private/shared or activity-type classification directly: earlier
      versions of this level computed those booleans from the same
      ground-truth fields used by label_derivation.py and wrote them
      into the sentence almost verbatim (e.g. "Multiple household
      members were..." for occupancy_state = multiple_residents_active),
      which made several privacy and utility labels recoverable by
      string match rather than inference. See docs/annotation_guidelines.md.
    remove_identity: true
    coarsen_time: true
    coarsen_location: true
    aggregate_only: true

# Functional room categories for C3 narrative coarsening. Intentionally
# a different taxonomy, and different vocabulary, from
# label_derivation.py's ROOM_CATEGORIES_DEFAULT (private_area /
# shared_area), which is what the private_location task's ground truth
# is derived from. The two must not share category names.
room_categories:
  sleeping_area:
    - bedroom
    - bedroom_1
    - bedroom_2
  hygiene_area:
    - bathroom
  work_area:
    - office
    - study
  food_area:
    - kitchen
  dining_area:
    - dining_room
  communal_area:
    - living_room
  passage_area:
    - hallway
    - entrance
    - garage

# Time-of-day bucket boundaries (24h clock, local time) for C2+.
time_periods:
  - name: early_morning
    start: "04:00"
    end: "07:00"
  - name: morning
    start: "07:00"
    end: "11:00"
  - name: midday
    start: "11:00"
    end: "14:00"
  - name: afternoon
    start: "14:00"
    end: "18:00"
  - name: evening
    start: "18:00"
    end: "22:00"
  - name: late_evening
    start: "22:00"
    end: "24:00"
  - name: night
    start: "00:00"
    end: "04:00"
