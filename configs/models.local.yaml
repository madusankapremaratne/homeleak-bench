# Local-only model roster for running the benchmark against Ollama without
# any cloud API keys. Use with:
#   python scripts/run_pilot.py --config configs/benchmark.yaml --models configs/models.local.yaml
#
# Requires `ollama serve` running with these models pulled
# (`ollama pull llama3.2`, etc).

generation:
  temperature: 0
  top_p: 1.0
  max_tokens: 300
  retries: 2
  seed: 42
  timeout_seconds: 120

cache:
  enabled: true
  path: "results/cached_outputs"

models:
  - id: "llama3.2:latest"
    provider: "local"
    role: "small_open_weight"
    endpoint: "http://localhost:11434/v1"

  - id: "phi3.5:latest"
    provider: "local"
    role: "small_open_weight"
    endpoint: "http://localhost:11434/v1"

  - id: "qwen3-local:latest"
    provider: "local"
    role: "medium_open_weight"
    endpoint: "http://localhost:11434/v1"
